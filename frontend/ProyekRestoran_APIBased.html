<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resto Nusantara - Menu Restoran</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🍽️</span>
                <h1 class="text-2xl font-bold text-emerald-600 tracking-tight">Resto Nusantara</h1>
            </div>
            <!-- Search Bar -->
            <div class="relative w-full md:w-72">
                <input type="text" id="search-input" placeholder="Cari menu favorit..." 
                    class="w-full pl-10 pr-4 py-2 border rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-gray-50">
                <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="bg-emerald-600 text-white py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto space-y-3">
            <h2 class="text-3xl md:text-4xl font-extrabold">Cita Rasa Otentik Spesial Untukmu</h2>
            <p class="text-emerald-100 text-sm md:text-base">Dibuat dari bahan-bahan segar berkualitas terbaik setiap harinya.</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-10 flex-grow w-full">
        
        <!-- Filter Kategori -->
        <div class="flex justify-center gap-2 mb-8 flex-wrap" id="filter-container">
            <button onclick="filterKategori('Semua')" class="filter-btn bg-emerald-600 text-white px-5 py-2 rounded-full text-sm font-medium transition-all shadow-md">Semua</button>
            <button onclick="filterKategori('Makanan')" class="filter-btn bg-white text-gray-600 hover:bg-emerald-50 px-5 py-2 rounded-full text-sm font-medium border transition-all">Makanan</button>
            <button onclick="filterKategori('Minuman')" class="filter-btn bg-white text-gray-600 hover:bg-emerald-50 px-5 py-2 rounded-full text-sm font-medium border transition-all">Minuman</button>
        </div>

        <!-- Container Grid Menu -->
        <div id="daftar-menu" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Card menu akan dirender lewat JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 text-center py-6 text-sm">
        <p>&copy; 2026 Resto Nusantara. All rights reserved.</p>
    </footer>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Custom Logic -->
    <script src="app.js"></script>
</body>
</html>
